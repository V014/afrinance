<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Afrinance</title>
</head>
<body>
    <div>
        <div class="login-header">
            <img src="img/brand/logo-green.png" alt="" srcset="">
            <h1>Afrinance</h1>
            <h3>Enter your credentials</h3>
        </div>
        <div class="login-form">
            <form action="">
                
                <div class="form-input">
                    <input type="text" class="default-input" id="username" name="username" placeholder="username" required>
                </div>
                
                <div class="form-input">
                    <input type="password" class="default-input" id="password" name="password" placeholder="password" required>
                </div>

                <div class="login-btn">
                    <button type="submit" class="default-btn">Login</button>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
