<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <title>Afrinance</title>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-panel">
            <div class="login-header text-center mb-6">
                <!-- THE BRAND ICON -->
                <div class="brand-image-wrapper">
                    <img
                    class="brand-image"
                    src="img/brand/logo-green.png"
                    alt="Afrinance"
                    onerror="this.style.display = 'none'"
                    />
                </div>
                <h1 class="title-style">Afrinance</h1>
                <p class="sub-style">Enter your credentials</p>
            </div>
            <div class="login-form">
                <form id="loginForm" action="">
                    
                    <div class="form-input">
                        <input type="text" class="default-input" id="username" name="username" placeholder="username" required>
                    </div>
                    
                    <div class="form-input">
                        <input type="password" class="default-input" id="password" name="password" placeholder="password" required>
                    </div>

                    <div class="login-btn">
                        <button type="submit" class="btn-primary">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
</body>
</html>
