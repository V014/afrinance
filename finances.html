<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dashboard.css">
    <title>Transactions</title>
</head>
<body>
    <!-- Mobile top bar -->
    <div class="mobile-topbar">
        <button class="mobile-menu-btn" id="mobileToggleBtn" aria-label="Toggle Sidebar">☰</button>
        <span class="mobile-topbar-title">Afrinance</span>
    </div>

    <!-- Backdrop overlay when menu is open on mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Container -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="toggle-btn" id="desktopToggleBtn" aria-label="Toggle Sidebar"></button>
            <!-- <button class="toggle-btn" id="desktopToggleBtn" aria-label="Close Sidebar">✕</button> -->
            <span class="logo-text" style="font-weight: bold;">Afrinance</span>
        </div>
        
        <ul class="nav-list">
            <li>
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="transactions.html" class="nav-item">
                    <span class="icon">🪙</span>
                    <span class="nav-text">Transaction</span>
                </a>
            </li>
            <li>
                <a href="finances.html" class="nav-item active">
                    <span class="icon">🧮</span>
                    <span class="nav-text">Finances</span>
                </a>
            </li>
            <li>
                <a href="assets.html" class="nav-item">
                    <span class="icon">🏛️</span>
                    <span class="nav-text">Assets</span>
                </a>
            </li>
            <li>
                <a href="employees.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span class="nav-text">Employees</span>
                </a>
            </li>
            <li>
                <a href="loans.html" class="nav-item">
                    <span class="icon">💸</span>
                    <span class="nav-text">Loans</span>
                </a>
            </li>
            <li>
                <a href="salaries.html" class="nav-item">
                    <span class="icon">✉️</span>
                    <span class="nav-text">Salaries</span>
                </a>
            </li>
            <li>
                <a href="settings.html" class="nav-item">
                    <span class="icon">⚙️</span>
                    <span class="nav-text">Settings</span>
                </a>
            </li>
        </ul>
    </nav>
    <main class="main-content">
        <h1>Finances</h1>

        <div class="dashboard-header">
            <button class="modal-btn" id="newFinanceBtn">Track finance</button>
            <!-- Date Filter -->
            <input type="month" id="filterDate" name="filterDate" class="filter-select">
        </div>

        <!-- New finance modal -->
        <div class="modal" id="newFinanceModal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>New Finance</h2>
            </div>
        </div>

        <!-- KPI cards -->
        <div class="kpi-cards">
            <div class="kpi-card">
                <h2>Capital</h2>
                <p>MWK5,200,000</p>
            </div>
            <div class="kpi-card">
                <h2>Sales</h2>
                <p>MWK1,200,000</p>
            </div>
            <div class="kpi-card">
                <h2>Expenses</h2>
                <p>MWK423,000</p>
            </div>
            <div class="kpi-card">
                <h2>Profit</h2>
                <p>MWK699,000</p>
            </div>
            <div class="kpi-card">
                <h2>Uptime</h2>
                <p>90.9%</p>
            </div>
            <div class="kpi-card">
                <h2>Best Month</h2>
                <p>June</p>
            </div>
        </div>

        <!-- Revenue chart -->
        <div class="chart-container">
            <canvas id="myChart" style="max-width:700px; height:400px"></canvas>
        </div>
    </main>
</body>
<script src="js/sidebar.js"></script>
<!-- <script src="js/googlecharts.js"></script> -->
 <script src="https://www.gstatic.com/charts/loader.js"></script>
<script src="js/revenuechart.js"></script>
</html>
